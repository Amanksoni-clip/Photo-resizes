<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Tools Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }
    .box {
      margin: 20px auto;
      padding: 20px;
      background: #222;
      width: 300px;
      border-radius: 10px;
    }
    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #00c3ff;
      color: black;
    }
    input {
      margin: 5px;
    }
    canvas {
      margin-top: 10px;
      max-width: 100%;
    }
  </style>
</head>
<body>

<h1>🔥 Image Tools Pro</h1>

<div class="box">
  <h3>Upload Image</h3>
  <input type="file" id="upload" accept="image/*">
</div>

<div class="box">
  <h3>Resize Image</h3>
  <input type="number" id="width" placeholder="Width">
  <input type="number" id="height" placeholder="Height"><br>
  <button onclick="resizeImage()">Resize</button>
  <br>
  <a id="downloadResized" download="resized.png">Download</a>
</div>

<div class="box">
  <h3>Convert to PDF</h3>
  <button onclick="convertToPDF()">Download PDF</button>
</div>

<canvas id="canvas"></canvas>

<script>
let img = new Image();

document.getElementById("upload").addEventListener("change", function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

function resizeImage() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const w = document.getElementById("width").value || img.width;
  const h = document.getElementById("height").value || img.height;

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, 0, 0, w, h);

  const link = document.getElementById("downloadResized");
  link.href = canvas.toDataURL();
}

async function convertToPDF() {
  const { jsPDF } = window.jspdf;

  const canvas = document.getElementById("canvas");
  const imgData = canvas.toDataURL("image/png");

  const pdf = new jsPDF();
  pdf.addImage(imgData, 'PNG', 10, 10, 180, 160);
  pdf.save("image.pdf");
}
</script>

</body>
</html>
